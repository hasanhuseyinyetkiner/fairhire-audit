server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    location /api/ {
        proxy_pass http://api:8104;
    }
    location = /health {
        proxy_pass http://api:8104/health;
    }
    location = /ready {
        proxy_pass http://api:8104/ready;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
